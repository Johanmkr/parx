name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs full history + tags to compute the version;
          # a shallow checkout would silently produce a 0.0.devN version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/parx/
    permissions:
      id-token: write # required for Trusted Publishing (OIDC) — no API token stored
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  update-citation:
    name: Bump CITATION.cff
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: bump-citation-main
      cancel-in-progress: false
    permissions:
      contents: write # to push the automation branch with the CITATION.cff update
      pull-requests: write # to open/update the CITATION.cff bump PR
    steps:
      - uses: actions/checkout@v4
        with:
          # release events default to checking out the tag; we want to branch from main.
          ref: main

      - name: Update version and date-released
        env:
          TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' isn't a plain vX.Y.Z release; skipping CITATION.cff bump."
            exit 0
          fi
          VERSION="${TAG#v}"
          DATE="${PUBLISHED_AT%%T*}"
          sed -i "s/^version: .*/version: ${VERSION}/" CITATION.cff
          sed -i "s/^date-released: .*/date-released: \"${DATE}\"/" CITATION.cff

          if git diff --quiet -- CITATION.cff; then
            echo "CITATION.cff already up to date; nothing to commit."
            exit 0
          fi

      - name: Create CITATION.cff bump pull request
        uses: peter-evans/create-pull-request@v7.0.11
        with:
          branch: automation/bump-citation
          base: main
          commit-message: "chore: bump CITATION.cff to ${{ github.event.release.tag_name }} [skip ci]"
          title: "chore: bump CITATION.cff to ${{ github.event.release.tag_name }}"
          body: |
            Automated CITATION.cff metadata update after publishing `${{ github.event.release.tag_name }}`.
